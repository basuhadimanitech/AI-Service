[project]
name = "cpai-service"
version = "0.1.0"
description = "CaptivateNext AI Q&A service - retrieval-augmented Q&A over course slide content, shared infra replacement for the runtime's former per-learner local Ollama install."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "httpx>=0.27,<1.0",
    "numpy>=1.26,<3.0",
    "pydantic>=2.0,<3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
