name: Build and Deploy

on:
  push:
    branches:
      - main

env:
  REGISTRY: basuaiacr.azurecr.io
  IMAGE_NAME: cpai-service

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - run: az acr login --name basuaiacr

    - name: Build Image
      run: |
        docker buildx build \
          --platform linux/amd64 \
          -t $REGISTRY/$IMAGE_NAME:${{ github.sha }} \
          -t $REGISTRY/$IMAGE_NAME:latest \
          --push .

    - name: Set AKS Context
      run: |
        az aks get-credentials \
          --resource-group ai-service-rg \
          --name cpai-cluster \
          --overwrite-existing

    - name: Deploy
      run: |
        kubectl set image deployment/cpai-service \
        cpai-service=$REGISTRY/$IMAGE_NAME:${{ github.sha }}

        kubectl rollout status deployment/cpai-service